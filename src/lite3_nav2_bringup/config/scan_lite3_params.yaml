scan_planner_node:
  ros__parameters:
    use_sim_time: false
    fsm.navi_mode: 3
    fsm.thresh_replan: 0.8
    fsm.thresh_no_replan: 0.15
    fsm.planning_horizon: 3.0
    fsm.emergency_time: 0.8
    fsm.fail_safe: true
    grid_map.frame_id: odom
    grid_map.sliding_map_frame_id: scan_sliding_map
    grid_map.sensor_type: lidar
    grid_map.cloud_is_world: false
    grid_map.need_extrinsic: false
    grid_map.resolution: 0.05
    grid_map.sliding_map_size_x: 8.0
    grid_map.sliding_map_size_y: 8.0
    grid_map.sliding_map_size_z: 3.0
    grid_map.local_update_range_x: 4.0
    grid_map.local_update_range_y: 4.0
    grid_map.local_update_range_z: 1.5
    grid_map.max_ray_length: 4.0
    grid_map.double_cylinder_radius: 0.25
    grid_map.double_cylinder_offset: 0.18
    grid_map.body_height: 0.40
    manager.max_vel: 0.20
    manager.max_acc: 0.30
    manager.max_jerk: 1.5
    manager.planning_horizon: 3.0
    optimization.max_vel: 0.20
    optimization.max_acc: 0.30

closed_loop_controller:
  ros__parameters:
    use_sim_time: false
    time_forward: 0.5
    heading_error_threshold: 0.6
    kp_pos: 0.6
    kp_yaw: 1.0
    max_vx: 0.15
    max_vy: 0.10
    max_vyaw: 0.25
    finish_dist: 0.15
