cloud_topic: /fastlio2/body_cloud
odom_topic: /fastlio2/lio_odom

map_frame: map
local_frame: odom

update_hz: 1.0

# Stabilize the dynamic map -> odom correction from scan matching.
# Initial ICP must stay near the RViz guess and agree for several frames.
# Later corrections are planar, dead-banded, low-pass filtered, and large
# one-frame jumps are rejected.
transform_filter_alpha: 0.20
translation_deadband: 0.02
yaw_deadband: 0.015
max_translation_jump: 0.25
max_yaw_jump: 0.25
# RViz clicking is approximate; allow ICP a wider correction only before the
# first accepted pose. Runtime corrections remain limited to 0.25 m above.
max_initial_translation_jump: 1.20
initial_consistency_count: 3
initial_consistency_translation: 0.20
initial_consistency_yaw: 0.08
# Revoke localization after repeated online ICP quality failures.
tracking_failure_count: 3

input_cloud_type: PointXYZ

rough_scan_resolution: 0.30
rough_map_resolution: 0.30
rough_max_iteration: 15
rough_score_thresh: 0.30
rough_max_correspondence_distance: 0.75

refine_scan_resolution: 0.15
refine_map_resolution: 0.15
refine_max_iteration: 20
refine_score_thresh: 0.10
refine_max_correspondence_distance: 0.30
# A low FitnessScore alone is insufficient: it ignores unmatched points.
min_overlap_ratio: 0.70
min_overlap_points: 80
# Remove the dominant near-horizontal plane before ICP. Otherwise a floor can
# produce a convincing score at many unrelated XY positions.
remove_ground_plane: true
ground_plane_distance: 0.08
ground_plane_min_points: 80
